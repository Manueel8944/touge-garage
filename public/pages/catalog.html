<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo — Touge Garage</title>
    <meta
      name="description"
      content="Catálogo de piezas de tuning JDM: escapes, suspensión, frenos, llantas y más."
    />

    <link rel="icon" href="../assets/favicon.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Orden: Bootstrap → iconos → globales → página -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/modals.css" />
    <link rel="stylesheet" href="../css/catalog.css" />
  </head>
  <body>
    <a
      class="visually-hidden-focusable btn btn-light position-absolute m-2 z-3"
      href="#contenido"
      >Saltar al contenido</a
    >

    <!-- HEADER -->
    <header class="sticky-top">
      <nav
        class="navbar navbar-expand site-header"
        data-bs-theme="dark"
        aria-label="Principal"
      >
        <div class="container">
          <a class="navbar-brand logo me-0" href="index.html">
            <img
              class="logo-img"
              src="../assets/logo-nav.png"
              alt="Touge Garage, inicio"
              height="70"
            />
          </a>

          <div class="d-flex align-items-center gap-1 ms-auto order-3">
            <button
              class="icon-btn"
              id="user-btn"
              type="button"
              aria-label="Iniciar sesión"
            >
              <i class="bi bi-person" aria-hidden="true"></i>
            </button>
            <button
              class="icon-btn"
              id="cart-btn"
              type="button"
              aria-label="Carrito, 0 artículos"
            >
              <i class="bi bi-cart3" aria-hidden="true"></i>
              <span class="icon-btn-badge" id="cart-count" hidden>0</span>
            </button>
          </div>

          <div class="navbar-collapse order-2">
            <ul class="navbar-nav mx-auto gap-3">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link active"
                  href="catalog.html"
                  aria-current="page"
                  >Catálogo</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contact.html">Contacto</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main id="contenido">
      <!-- TÍTULO -->
      <section class="catalog-head">
        <div class="container">
          <h1 class="catalog-title">Catálogo</h1>
          <p class="catalog-text">
            Todas las piezas disponibles. Filtra por categoría y precio para
            encontrar lo que encaja con tu coche.
          </p>
        </div>
      </section>

      <div class="container">
        <div class="row g-4">
          <!-- FILTROS -->
          <aside class="col-3">
            <div class="filters">
              <h2 class="fs-4 mb-3">Filtros</h2>
              <form class="filters-box" id="filter-form" novalidate>
                <fieldset class="filters-group">
                  <legend class="filters-legend">Categoría</legend>
                  <div id="filter-categories"></div>
                </fieldset>

                <fieldset class="filters-group">
                  <legend class="filters-legend">Precio (€)</legend>
                  <div class="row g-2">
                    <div class="col-6">
                      <label class="visually-hidden" for="f-min"
                        >Precio mínimo</label
                      >
                      <input
                        class="form-control"
                        id="f-min"
                        name="min"
                        type="number"
                        min="0"
                        placeholder="Mín."
                      />
                    </div>
                    <div class="col-6">
                      <label class="visually-hidden" for="f-max"
                        >Precio máximo</label
                      >
                      <input
                        class="form-control"
                        id="f-max"
                        name="max"
                        type="number"
                        min="0"
                        placeholder="Máx."
                      />
                    </div>
                  </div>
                </fieldset>

                <fieldset class="filters-group">
                  <legend class="filters-legend">Disponibilidad</legend>
                  <div class="form-check form-switch">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      role="switch"
                      id="f-stock"
                      name="stock"
                    />
                    <label class="form-check-label" for="f-stock"
                      >Solo en stock</label
                    >
                  </div>
                </fieldset>

                <button
                  class="btn btn-ghost w-100"
                  type="button"
                  id="filters-reset"
                >
                  Limpiar filtros
                </button>
              </form>
            </div>
          </aside>

          <!-- PRODUCTOS -->
          <section class="col-9" aria-label="Productos">
            <div class="catalog-toolbar">
              <p
                class="catalog-count"
                id="catalog-count"
                aria-live="polite"
              ></p>
            </div>

            <div id="catalog-grid"></div>
          </section>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="container">
        <div class="row align-items-center g-3">
          <div class="col-4 text-start">
            <a class="logo" href="index.html">
              <img
                class="logo-img logo-img-footer"
                src="../assets/logo-footer.png"
                alt="Touge Garage, inicio"
                height="90"
                loading="lazy"
              />
            </a>
          </div>
          <div class="col-4 text-center">
            <p class="footer-copy mb-0">
              © 2026 Touge Garage. Todos los derechos reservados.
            </p>
          </div>
          <div class="col-4">
            <ul
              class="footer-social d-flex justify-content-end gap-1 mb-0"
              aria-label="Redes sociales"
            >
              <li>
                <a class="icon-btn" href="#" aria-label="Instagram"
                  ><i class="bi bi-instagram" aria-hidden="true"></i
                ></a>
              </li>
              <li>
                <a class="icon-btn" href="#" aria-label="YouTube"
                  ><i class="bi bi-youtube" aria-hidden="true"></i
                ></a>
              </li>
              <li>
                <a class="icon-btn" href="#" aria-label="TikTok"
                  ><i class="bi bi-tiktok" aria-hidden="true"></i
                ></a>
              </li>
              <li>
                <a class="icon-btn" href="#" aria-label="Facebook"
                  ><i class="bi bi-facebook" aria-hidden="true"></i
                ></a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/cart.js"></script>
    <script type="module" src="../js/catalog.js"></script>
  </body>
</html>
