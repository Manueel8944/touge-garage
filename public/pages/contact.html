<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Contacto | Touge Garage</title>

    <meta
      name="description"
      content="Contacta con Touge Garage. Estamos aquí para ayudarte con tus consultas sobre piezas JDM y tuning."
    />

    <link rel="icon" href="../assets/favicon.png" type="image/png" />

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/modals.css" />
    <link rel="stylesheet" href="../css/contact.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="sticky-top">
      <nav class="navbar navbar-expand site-header" data-bs-theme="dark">
        <div class="container">
          <a class="navbar-brand logo me-0" href="index.html">
            <img
              class="logo-img"
              src="../assets/logo-nav.png"
              alt="Touge Garage"
            />
          </a>

          <div class="d-flex align-items-center gap-1 ms-auto order-3">
            <button
              class="icon-btn"
              id="user-btn"
              type="button"
              aria-label="Iniciar sesión"
            >
              <i class="bi bi-person" aria-hidden="true"></i>
            </button>

            <button
              class="icon-btn"
              id="cart-btn"
              type="button"
              aria-label="Carrito, 0 artículos"
            >
              <i class="bi bi-cart3" aria-hidden="true"></i>
              <span class="icon-btn-badge" id="cart-count" hidden>0</span>
            </button>

          </div>
          <div class="navbar-collapse order-2">
            <ul class="navbar-nav mx-auto gap-3">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="catalog.html">Catálogo</a>
              </li>

              <li class="nav-item">
                <a
                  class="nav-link active"
                  href="contact.html"
                  aria-current="page"
                  >Contacto</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- CONTENIDO -->
    <main id="contenido" class="contact-page">
      <section class="contact-container">
        <!-- Imagen lateral sin texto -->
        <div class="contact-info"></div>

        <!-- Formulario -->
        <div class="contact-form-wrapper">
          <div class="form-heading">
            <span class="info-tag">CONTACTO</span>

            <h1>Envíanos un mensaje</h1>

            <p>
              ¿Tienes alguna duda sobre una pieza o necesitas asesoramiento?
              Escríbenos.
            </p>
          </div>

          <form action="thankyou.html" method="GET">
            <div class="form-row">
              <div class="form-group">
                <label for="name" class="form-label">Nombre</label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  placeholder="Tu nombre"
                  required
                />
              </div>

              <div class="form-group">
                <label for="email" class="form-label">Correo electrónico</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="tu@email.com"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="subject" class="form-label">Asunto</label>

              <select class="form-select" id="subject" name="subject" required>
                <option value="" selected disabled>Selecciona un asunto</option>
                <option value="consulta">Consulta general</option>
                <option value="producto">Consulta sobre un producto</option>
                <option value="pedido">Problema con un pedido</option>
                <option value="compatibilidad">Compatibilidad de piezas</option>
                <option value="otro">Otro</option>
              </select>
            </div>

            <div class="form-group">
              <label for="message" class="form-label">Mensaje</label>

              <textarea
                class="form-control"
                id="message"
                name="message"
                rows="4"
                placeholder="Cuéntanos en qué podemos ayudarte..."
                required
              ></textarea>
            </div>

            <button type="submit" class="btn btn-primary contact-submit">
              Enviar mensaje
              <i class="bi bi-arrow-right" aria-hidden="true"></i>
            </button>

            <p class="form-privacy">
              Al enviar este formulario aceptas que utilicemos tus datos para
              responder a tu consulta.
            </p>
          </form>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="container">
        <div class="row align-items-center g-3">
          <div class="col-4 text-start">
            <a class="logo" href="index.html">
              <img
                class="logo-img logo-img-footer"
                src="../assets/logo-footer.png"
                alt="Touge Garage"
                loading="lazy"
              />
            </a>
          </div>

          <div class="col-4 text-center">
            <p class="footer-copy mb-0">
              © 2026 Touge Garage. Todos los derechos reservados.
            </p>
          </div>

          <div class="col-4">
            <ul
              class="footer-social d-flex justify-content-end gap-1 mb-0"
              aria-label="Redes sociales"
            >
              <li>
                <a class="icon-btn" href="#" aria-label="Instagram">
                  <i class="bi bi-instagram"></i>
                </a>
              </li>

              <li>
                <a class="icon-btn" href="#" aria-label="YouTube">
                  <i class="bi bi-youtube"></i>
                </a>
              </li>

              <li>
                <a class="icon-btn" href="#" aria-label="TikTok">
                  <i class="bi bi-tiktok"></i>
                </a>
              </li>

              <li>
                <a class="icon-btn" href="#" aria-label="Facebook">
                  <i class="bi bi-facebook"></i>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/cart.js"></script>
  </body>
</html>
